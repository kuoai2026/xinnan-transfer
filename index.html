<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>信男藥局 · 倉庫調貨單</title>
<style>
  :root{
    --bg:#0f172a; --bg2:#111c33; --card:#1e293b; --card2:#243349;
    --line:#334155; --txt:#e2e8f0; --dim:#94a3b8; --dimmer:#64748b;
    --accent:#38bdf8; --accent-d:#0ea5e9; --ok:#34d399; --warn:#fbbf24;
    --danger:#f87171; --danger-bg:#7f1d1d;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;
    font-size:16px;line-height:1.5;overflow-x:hidden}
  body{padding-bottom:96px}
  input,button,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none}

  header{position:sticky;top:0;z-index:20;background:rgba(15,23,42,.94);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    padding:10px 14px calc(10px + env(safe-area-inset-top))}
  header .t{font-size:17px;font-weight:700;letter-spacing:.5px}
  header .s{font-size:12px;color:var(--dim);margin-top:2px}

  .wrap{max-width:640px;margin:0 auto;padding:14px}
  section{margin-bottom:16px}
  .lbl{font-size:13px;color:var(--dim);margin-bottom:7px;font-weight:600}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:9px 16px;border-radius:999px;background:var(--card);
    border:1px solid var(--line);font-size:15px;transition:.12s}
  .chip.on{background:var(--accent);color:#00263a;border-color:var(--accent);font-weight:700}
  #otherName{margin-top:8px;width:100%;padding:11px 13px;border-radius:12px;
    background:var(--card);border:1px solid var(--line)}
  #otherName.hide{display:none}

  .searchbox{position:relative}
  #q{width:100%;padding:14px 44px 14px 44px;border-radius:12px;
    background:var(--card);border:1px solid var(--line);font-size:16px}
  #q:focus{outline:none;border-color:var(--accent)}
  .searchbox .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--dim)}
  #qclear{position:absolute;right:8px;top:50%;transform:translateY(-50%);
    width:30px;height:30px;border-radius:50%;color:var(--dim);font-size:18px;display:none}
  #qclear.show{display:block}
  .hint{font-size:12px;color:var(--dimmer);margin-top:6px}

  .series{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    margin-bottom:10px;overflow:hidden}
  .series>.sh{display:flex;align-items:center;gap:10px;padding:12px 13px;width:100%;text-align:left}
  .series>.sh .name{flex:1;font-size:14px;font-weight:600;line-height:1.35}
  .series>.sh .cat{font-size:11px;color:var(--dimmer)}
  .series>.sh .cnt{font-size:12px;color:var(--dim);white-space:nowrap}
  .series>.sh .caret{color:var(--dim);transition:.15s;font-size:13px}
  .series.open>.sh .caret{transform:rotate(90deg)}
  .quickfill{display:flex;gap:6px;padding:0 13px 10px;flex-wrap:wrap}
  .quickfill span{font-size:12px;color:var(--dimmer);align-self:center}
  .quickfill button{padding:5px 12px;border-radius:8px;background:var(--card2);
    border:1px solid var(--line);font-size:13px;color:var(--dim)}

  .items{border-top:1px solid var(--line);display:none}
  .series.open .items{display:block}
  .row{display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid var(--bg2)}
  .row:last-child{border-bottom:none}
  .row .info{flex:1;min-width:0}
  .row .nm{font-size:14px;line-height:1.35;word-break:break-word}
  .row .meta{display:flex;gap:8px;align-items:center;margin-top:3px;flex-wrap:wrap}
  .stock{font-size:11px;padding:1px 7px;border-radius:6px;font-weight:600}
  .stock.pos{background:#064e3b;color:#6ee7b7}
  .stock.zero{background:#3f3f46;color:#a1a1aa}
  .stock.neg{background:var(--danger-bg);color:#fecaca}
  .sku{font-size:11px;color:var(--dimmer);font-family:ui-monospace,monospace}
  .alias{font-size:11px;color:var(--dimmer)}

  .stepper{display:flex;align-items:center;gap:0;background:var(--bg);border:1px solid var(--line);
    border-radius:10px;overflow:hidden;flex-shrink:0}
  .stepper button{width:36px;height:36px;font-size:19px;color:var(--accent);font-weight:700}
  .stepper button:active{background:var(--card2)}
  .stepper input{width:42px;height:36px;text-align:center;background:transparent;border:none;
    border-left:1px solid var(--line);border-right:1px solid var(--line);font-size:15px;
    -moz-appearance:textfield}
  .stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
  .row.active{background:var(--card2)}
  .row .extra{display:none;flex-basis:100%;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
  .row.active .extra{display:flex}
  .row.active{flex-wrap:wrap}
  .ck{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--dim)}
  .ck input{width:17px;height:17px;accent-color:var(--warn)}
  .row .extra input[type=text]{flex:1;min-width:120px;padding:7px 10px;border-radius:8px;
    background:var(--bg);border:1px solid var(--line);font-size:13px}

  .manual .mrow{display:flex;flex-wrap:wrap;gap:8px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:10px;margin-bottom:8px}
  .manual .mrow input[type=text]{padding:9px 11px;border-radius:9px;background:var(--bg);
    border:1px solid var(--line);font-size:14px}
  .manual .mrow .mname{flex:1 1 100%}
  .manual .mrow .mqty{width:76px;text-align:center}
  .manual .mrow .munit{width:74px}
  .manual .mrow .mnote{flex:1 1 140px}
  .manual .mrow .mdel{margin-left:auto;color:var(--danger);font-size:13px;padding:4px 8px}
  .addbtn{width:100%;padding:11px;border-radius:12px;background:var(--card);
    border:1px dashed var(--line);color:var(--accent);font-size:14px;font-weight:600}

  .recent .rc{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:11px 13px;margin-bottom:8px;font-size:13px}
  .recent .rc .h{display:flex;justify-content:space-between;color:var(--dim);margin-bottom:4px;font-size:12px}
  .recent .rc .sm{color:var(--txt);line-height:1.5;word-break:break-word}

  .cartbar{position:fixed;left:0;right:0;bottom:0;z-index:30;
    padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    background:rgba(15,23,42,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);
    display:flex;gap:12px;align-items:center}
  .cartbar .sum{flex:1;font-size:14px;color:var(--dim)}
  .cartbar .sum b{color:var(--txt);font-size:16px}
  .cartbar button{padding:13px 22px;border-radius:12px;background:var(--accent);color:#00263a;
    font-weight:800;font-size:15px}
  .cartbar button:disabled{background:var(--line);color:var(--dimmer)}

  dialog{border:none;background:var(--card);color:var(--txt);border-radius:16px 16px 0 0;
    padding:0;width:100%;max-width:640px;margin:auto auto 0;position:fixed;inset:0;top:auto;
    max-height:92vh}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  .dlg-h{position:sticky;top:0;background:var(--card);padding:14px 16px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;font-weight:700}
  .dlg-h button{color:var(--dim);font-size:22px}
  .dlg-b{padding:14px 16px;overflow-y:auto}
  .rvitem{padding:9px 0;border-bottom:1px solid var(--bg2);font-size:14px;display:flex;gap:8px}
  .rvitem .x{flex:1}
  .rvitem .badge{font-size:11px;color:var(--warn);border:1px solid var(--warn);border-radius:6px;
    padding:0 5px;align-self:flex-start;margin-top:2px}
  .rvitem .n{color:var(--dim);font-size:12px;margin-top:2px}
  .rvitem .qq{font-weight:700;white-space:nowrap}
  #ordNote{width:100%;margin-top:12px;padding:11px;border-radius:10px;background:var(--bg);
    border:1px solid var(--line);font-size:14px;min-height:64px;resize:vertical}
  .dlg-f{position:sticky;bottom:0;background:var(--card);padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line)}
  .dlg-f button{width:100%;padding:14px;border-radius:12px;background:var(--ok);color:#00291c;
    font-weight:800;font-size:16px}
  .dlg-f button:disabled{background:var(--line);color:var(--dimmer)}

  .toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:50;
    background:#1e293b;border:1px solid var(--line);padding:11px 18px;border-radius:12px;
    font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:0;transition:.2s;pointer-events:none}
  .toast.show{opacity:1}
  .toast.err{border-color:var(--danger);color:#fecaca}

  .empty{color:var(--dimmer);font-size:14px;text-align:center;padding:26px 0}
  .done{text-align:center;padding:40px 16px}
  .done .big{font-size:52px}
  .done h2{margin:12px 0 6px}
  .done p{color:var(--dim);font-size:14px}
  .done button{margin-top:20px;padding:12px 26px;border-radius:12px;background:var(--accent);
    color:#00263a;font-weight:700}
  .divider{height:1px;background:var(--line);margin:22px 0}
</style>
</head>
<body>
<header>
  <div class="t">信男藥局 · 倉庫調貨單</div>
  <div class="s" id="buildInfo"></div>
</header>

<div class="wrap" id="app">
  <section id="who">
    <div class="lbl">填寫人員</div>
    <div class="chips" id="persons"></div>
    <input id="otherName" class="hide" placeholder="請輸入姓名" autocomplete="off">
  </section>

  <section class="searchbox">
    <div class="lbl">搜尋商品</div>
    <div style="position:relative">
      <span class="ico">🔍</span>
      <input id="q" placeholder="品名／顏色／品牌／貨號…" autocomplete="off" enterkeyhint="search">
      <button id="qclear" aria-label="清除">✕</button>
    </div>
    <div class="hint">例：<b>郡昱成人平面</b>、<b>興安 大耳狗</b>、<b>電解水</b>、<b>B0043L004</b>。搜不到的商品請用下面「系統沒有的商品」填。</div>
  </section>

  <section id="results"></section>

  <section class="manual">
    <div class="lbl">系統沒有的商品（自由填寫）</div>
    <div id="mrows"></div>
    <button class="addbtn" id="addManual">＋ 新增一列</button>
  </section>

  <section class="recent" id="recentWrap" style="display:none">
    <div class="divider"></div>
    <div class="lbl">這台裝置最近送出的調貨單</div>
    <div id="recentList"></div>
  </section>
</div>

<div class="cartbar">
  <div class="sum">本次調貨 <b id="cartCount">0</b> 項</div>
  <button id="openReview" disabled>檢視並送出</button>
</div>

<dialog id="review">
  <div class="dlg-h"><span>確認調貨清單</span><button id="closeReview" aria-label="關閉">✕</button></div>
  <div class="dlg-b">
    <div id="rvList"></div>
    <div class="lbl" style="margin-top:16px">整張單備註（箱子大小、帳單要回、指定效期…）</div>
    <textarea id="ordNote" placeholder="非必填"></textarea>
  </div>
  <div class="dlg-f"><button id="submitBtn">送出給倉庫</button></div>
</dialog>

<div class="toast" id="toast"></div>

/* search */
let openSeries = new Set();

function computeHits(toks){
  const hit = new Map();
  // Pass A：品項層級 —— 每個 token 直接出現在該品項字串
  for(const it of ITEMS){
    if(toks.every(t=>it.blob.includes(t))){
      if(!hit.has(it.series)) hit.set(it.series, []);
      hit.get(it.series).push(it);
    }
  }
  // 精修：token 若能在同系列某些品項的「規格名」裡找到，就只留規格名含該 token 的品項
  //（系統商品名常把整排顏色/角色當 SEO 關鍵字塞進去，會誤中兄弟品項）
  for(const [sn, arr] of hit){
    let cand = arr;
    for(const t of toks){
      const strong = cand.filter(it=>it.vg.includes(t));
      if(strong.length && strong.length < cand.length) cand = strong;
    }
    hit.set(sn, cand);
  }
  // Pass B：系列層級 fallback —— token 全命中系列名/別名，且 Pass A 沒抓到 → 帶出整個系列
  for(const [sn, grp] of BY_SERIES){
    if(hit.has(sn)) continue;
    if(toks.every(t=>grp.extra.includes(t))) hit.set(sn, grp.items.slice());
  }
  return hit;
}
// 無空格複合詞：把一串字切成 2~4 段（每段 2~5 字，結尾可 1 字＝顏色）的各種切法，段數少的優先
function segmentations(t){
  const res = [];
  (function rec(start, parts){
    if(start === t.length){ if(parts.length >= 2 && parts.length <= 4) res.push(parts.slice()); return; }
    if(parts.length >= 4) return;
    const lo = (t.length - start === 1) ? 1 : 2;
    for(let end = start+lo; end <= t.length && end-start <= 5; end++){
      parts.push(t.slice(start, end)); rec(end, parts); parts.pop();
    }
  })(0, []);
  return res.sort((a,b)=>a.length-b.length).slice(0, 250);
}
function doSearch(){
  const raw = $('#q').value.trim().toLowerCase();
  $('#qclear').classList.toggle('show', !!$('#q').value);
  const box = $('#results');
  if(raw.length < 1){ box.innerHTML = '<div class="empty">輸入關鍵字開始搜尋<br>已收錄 '+ITEMS.length+' 項商品</div>'; return; }
  // 中文與英數字交界處自動補空格（例：安心罩護m黑 → 安心罩護 m 黑）
  const spaced = raw.replace(/([一-鿿])([a-z0-9])/g,'$1 $2').replace(/([a-z0-9])([一-鿿])/g,'$1 $2');
  const toks = spaced.split(/[\s,、\/]+/).filter(Boolean);
  let hitSeries = computeHits(toks);
  // 搜不到 → 把關鍵字併起來自動斷詞再試
  if(!hitSeries.size){
    const joined = toks.join('');
    if(joined.length >= 4 && joined.length <= 12){
      for(const seg of segmentations(joined)){
        const h = computeHits(seg);
        if(h.size){ hitSeries = h; break; }
      }
    }
  }
  if(!hitSeries.size){ box.innerHTML = '<div class="empty">找不到「'+esc(raw)+'」<br>請改用空格分隔關鍵字，或用下面「系統沒有的商品」填寫</div>'; return; }
  const seriesArr = [...hitSeries.entries()].slice(0,40);
  box.innerHTML = seriesArr.map(([sn,its])=>seriesCard(sn,its,its.length)).join('');
  bindResults();
}
function seriesCard(sn, its, n){
  const grp = BY_SERIES.get(sn);
  const full = grp.items.length;
  const open = openSeries.has(sn);
  const showItems = open ? grp.items : its;
  return `<div class="series${open?' open':''}" data-s="${esc(sn)}">
    <button class="sh" data-toggle>
      <span class="name">${esc(grp.disp)}<div class="cat">${esc(grp.cat)}</div></span>
      <span class="cnt">${open?full:n} 項</span>
      <span class="caret">▶</span>
    </button>
    <div class="quickfill">
      <span>整排填</span>
      <button data-qf="1">1</button><button data-qf="2">2</button><button data-qf="3">3</button>
      <button data-qf="0">清除</button>
      ${(!open && full>its.length)?`<button data-showall style="margin-left:auto">顯示全部 ${full} 項</button>`:''}
    </div>
    <div class="items">${showItems.map(itemRow).join('')}</div>
  </div>`;
}
function itemRow(it){
  const c = state.cart[it.sku];
  const qty = c? c.qty : 0;
  const sc = it.avail>0?'pos':(it.avail<0?'neg':'zero');
  return `<div class="row${qty?' active':''}" data-sku="${esc(it.sku)}">
    <div class="info">
      <div class="nm">${esc(it.name)}</div>
      <div class="meta">
        <span class="stock ${sc}">可售 ${it.avail}</span>
        <span class="sku">${esc(it.sku)}</span>
      </div>
    </div>
    <div class="stepper">
      <button data-m>−</button>
      <input type="number" inputmode="numeric" pattern="[0-9]*" value="${qty||''}" data-qty>
      <button data-p>＋</button>
    </div>
    <div class="extra">
      <label class="ck"><input type="checkbox" data-custom ${c&&c.custom?'checked':''}>客訂</label>
      <input type="text" data-note placeholder="備註（欠客數、指定效期…）" value="${c?esc(c.note||''):''}">
    </div>
  </div>`;
}
function bindResults(){
  document.querySelectorAll('#results .series').forEach(el=>{
    const sn = el.dataset.s;
    el.querySelector('[data-toggle]').onclick=()=>{
      if(openSeries.has(sn)) openSeries.delete(sn); else openSeries.add(sn);
      doSearch();
    };
    const sa = el.querySelector('[data-showall]');
    if(sa) sa.onclick=(e)=>{ e.stopPropagation(); openSeries.add(sn); doSearch(); };
    el.querySelectorAll('[data-qf]').forEach(b=>b.onclick=(e)=>{
      e.stopPropagation();
      const v = +b.dataset.qf;
      const grp = BY_SERIES.get(sn);
      const visible = openSeries.has(sn) ? grp.items
        : [...el.querySelectorAll('.row')].map(r=>ITEMS.find(i=>i.sku===r.dataset.sku));
      visible.forEach(it=>setQty(it, v, {silent:true}));
      doSearch(); updateCart();
    });
    el.querySelectorAll('.row').forEach(row=>{
      const sku = row.dataset.sku;
      const it = ITEMS.find(i=>i.sku===sku);
      row.querySelector('[data-m]').onclick=()=>{ chg(it,-1); };
      row.querySelector('[data-p]').onclick=()=>{ chg(it, 1); };
      const qi = row.querySelector('[data-qty]');
      qi.onchange=()=>{ setQty(it, Math.max(0, parseInt(qi.value||'0',10)||0)); };
      const cc = row.querySelector('[data-custom]');
      if(cc) cc.onchange=()=>{ if(state.cart[sku]){ state.cart[sku].custom=cc.checked; save(); } };
      const nn = row.querySelector('[data-note]');
      if(nn) nn.oninput=()=>{ if(state.cart[sku]){ state.cart[sku].note=nn.value; save(); } };
    });
  });
}
function chg(it, d){ setQty(it, Math.max(0, (state.cart[it.sku]?state.cart[it.sku].qty:0)+d)); }
function setQty(it, q, opt){
  opt=opt||{};
  if(q>0){
    const prev = state.cart[it.sku]||{};
    state.cart[it.sku] = {qty:q, custom:!!prev.custom, note:prev.note||'',
      name:it.name, series:it.series, avail:it.avail};
  } else {
    delete state.cart[it.sku];
  }
  save();
  if(!opt.silent){ doSearch(); updateCart(); }
}

      <input class="mqty" type="number" inputmode="numeric" placeholder="數量" value="${m.qty!==''?esc(m.qty):''}">
      <input class="munit" type="text" placeholder="單位" value="${esc(m.unit)}">
      <label class="ck"><input type="checkbox" ${m.custom?'checked':''}>客訂</label>
      <input class="mnote" type="text" placeholder="備註" value="${esc(m.note)}">
      <button class="mdel">刪除</button>`;
    const [nm,qt,un,ck,nt] = [d.querySelector('.mname'),d.querySelector('.mqty'),
      d.querySelector('.munit'),d.querySelector('.ck input'),d.querySelector('.mnote')];
    nm.oninput=()=>{ m.name=nm.value; save(); updateCart(); };
    qt.oninput=()=>{ m.qty=qt.value; save(); updateCart(); };
    un.oninput=()=>{ m.unit=un.value; save(); };
    ck.onchange=()=>{ m.custom=ck.checked; save(); };
    nt.oninput=()=>{ m.note=nt.value; save(); };
    d.querySelector('.mdel').onclick=()=>{
      state.manual.splice(idx,1);
      if(!state.manual.length) state.manual=[blankManual()];
      save(); renderManual(); updateCart();
    };
    box.appendChild(d);
  });
}
$('#addManual').onclick=()=>{ state.manual.push(blankManual()); save(); renderManual(); };

/* cart summary */
function cartLines(){
  const lines = [];
  for(const [sku,c] of Object.entries(state.cart))
    lines.push({sku, name:c.name, series:c.series, qty:c.qty, custom:c.custom,
      note:c.note, avail:c.avail, manual:false});
  for(const m of state.manual){
    const q = parseInt(m.qty,10);
    if(m.name.trim() && q>0)
      lines.push({sku:'', name:m.name.trim(), series:'', qty:q, custom:m.custom,
        note:m.note, unit:m.unit.trim(), manual:true});
  }
  return lines;
}
function updateCart(){
  const lines = cartLines();
  $('#cartCount').textContent = lines.length;
  const ok = lines.length>0 && personName();
  $('#openReview').disabled = !ok;
}
function personName(){
  if(state.person==='其他') return state.otherName.trim();
  return state.person;
}

/* review dialog */
const dlg = $('#review');
$('#openReview').onclick=()=>{
  const lines = cartLines();
  $('#rvList').innerHTML = lines.map(l=>`
    <div class="rvitem">
      <div class="x">
        <div>${esc(l.name)} ${l.manual?'<span class="badge">系統沒有</span>':''} ${l.custom?'<span class="badge">客訂</span>':''}</div>
        ${l.series&&l.series!==l.name?`<div class="n">${esc(l.series)}</div>`:''}
        ${l.note?`<div class="n">備註：${esc(l.note)}</div>`:''}
        ${!l.manual?`<div class="n">${esc(l.sku)}　可售 ${l.avail}</div>`:(l.unit?`<div class="n">單位：${esc(l.unit)}</div>`:'')}
      </div>
      <div class="qq">×${l.qty}</div>
    </div>`).join('');
  $('#ordNote').value = state.ordNote||'';
  dlg.showModal();
};
$('#closeReview').onclick=()=>dlg.close();
$('#ordNote').oninput=e=>{ state.ordNote=e.target.value; save(); };

/* submit */
function summaryKey(l){
  const m = l.name.split(/[∣｜|]/);
  if(m.length > 1) return m[0].trim();
  let s = (l.series || l.name).replace(/【[^】]*】/g,'').replace(/\[[^\]]*\]/g,'')
    .replace(/（[^）]*）/g,'').trim();
  return (s.split(/[ 　／/,、]/)[0] || l.name).slice(0,18);
}
function summaryVariant(l, key){
  let n = l.name;
  const m = n.split(/[∣｜|]/);
  if(m.length > 1) n = m.slice(1).join(' ').trim();
  else if(key && n.startsWith(key)) n = n.slice(key.length).trim();
  return n;
}
function buildSummary(lines){
  const groups = new Map();
  const solo = [];
  for(const l of lines){
    const tag = (l.custom?'(客訂)':'') + (l.note?'['+l.note+']':'');
    if(l.manual){ solo.push('【手填】'+l.name+' '+l.qty+(l.unit||'')+tag); continue; }
    const key = summaryKey(l);
    const v = summaryVariant(l, key);
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push((v?v+' ':'')+l.qty+tag);
  }
  const parts = [...groups.entries()].map(([k,v])=>k+'：'+v.join('、'));
  return parts.concat(solo).join('\n');
}
let sending=false;
$('#submitBtn').onclick=async ()=>{
  if(sending) return;
  const lines = cartLines();
  const person = personName();
  if(!person){ toast('請先選填寫人員', true); return; }
  if(!lines.length){ toast('清單是空的', true); return; }
  sending=true; $('#submitBtn').disabled=true; $('#submitBtn').textContent='送出中…';
  const payload = {
    token: CONFIG.token, clientId: CID, person,
    ordNote: state.ordNote||'',
    summary: buildSummary(lines),
    items: lines.filter(l=>!l.manual).map(l=>({sku:l.sku,name:l.name,series:l.series,
      qty:l.qty,custom:l.custom,note:l.note||''})),
    manualItems: lines.filter(l=>l.manual).map(l=>({name:l.name,qty:l.qty,unit:l.unit||'',
      custom:l.custom,note:l.note||''}))
  };
  try{
    const res = await fetch(CONFIG.endpoint, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
    const j = await res.json();
    if(!j.ok) throw new Error(j.error||'送出失敗');
    // clear cart (keep person)
    state.cart={}; state.manual=[blankManual()]; state.ordNote='';
    save();
    dlg.close();
    showDone(j.id, lines.length);
    loadRecent(true);
  }catch(err){
    toast('送出失敗：'+err.message+'（請重試或截圖回報）', true);
    $('#submitBtn').disabled=false; $('#submitBtn').textContent='送出給倉庫';
  }
  sending=false;
};
function showDone(id, n){
  $('#app').innerHTML = `<div class="done">
    <div class="big">✅</div>
    <h2>已送出給倉庫</h2>
    <p>單號 ${esc(id||'')}　·　${n} 項　·　${esc(personName())}</p>
    <p>倉庫會收到 Email 通知。</p>
    <button onclick="location.reload()">再填一張</button>
  </div>`;
  document.querySelector('.cartbar').style.display='none';
  window.scrollTo(0,0);
}
function toast(msg, err){
  const t=$('#toast'); t.textContent=msg; t.className='toast show'+(err?' err':'');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.className='toast',3200);
}

/* recent submissions */
async function loadRecent(force){
  const person = personName();
  if(!CONFIG.endpoint) return;
  try{
    const u = CONFIG.endpoint+'?recent=1&token='+encodeURIComponent(CONFIG.token)
      +'&clientId='+encodeURIComponent(CID);
    const r = await fetch(u);
    const j = await r.json();
    if(!j.ok || !j.submissions || !j.submissions.length){ $('#recentWrap').style.display='none'; return; }
    $('#recentWrap').style.display='';
    $('#recentList').innerHTML = j.submissions.slice(0,8).map(s=>`
      <div class="rc">
        <div class="h"><span>單號 ${esc(s.id)}　${esc(s.person||'')}</span><span>${esc(s.time||'')}</span></div>
        <div class="sm">${esc(s.summary||'').replace(/\n/g,'<br>')}</div>
      </div>`).join('');
  }catch(e){ /* silent */ }
}
const loadRecentDebounced = (()=>{ let t; return f=>{ clearTimeout(t); t=setTimeout(()=>loadRecent(f),400); }; })();

/* wire search */
$('#q').addEventListener('input', doSearch);
$('#qclear').onclick=()=>{ $('#q').value=''; doSearch(); $('#q').focus(); };

/* init */
renderBuild();
renderPersons();
renderManual();
doSearch();
updateCart();
loadRecent();
</script>
